[project]
name = "hostboard-backend"
version = "0.1.0"
description = "FastAPI backend for the HostBoard restaurant waitlist manager"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pwdlib[argon2]>=0.2.1",
    "sqlalchemy>=2.1.1",
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
