name: agent-relay-homework3

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent_relay}
      POSTGRES_USER: ${POSTGRES_USER:-agent_relay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent_relay_local}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/10-create-test-database.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  agent-relay:
    build: .
    environment:
      RELAY_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agent_relay}:${POSTGRES_PASSWORD:-agent_relay_local}@postgres:5432/${POSTGRES_DB:-agent_relay}
    ports:
      - "${RELAY_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
